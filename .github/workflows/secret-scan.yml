name: secret-scan

# Layered defence: GitHub's built-in secret scanning (push protection + advanced
# secret scanning) catches the well-known credential formats. This workflow adds
# gitleaks on every PR and push to main as a second pair of eyes against project-
# specific patterns and any rule the platform doesn't yet ship.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # weekly full-history scan; catches anything that landed via direct push
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the weekly schedule
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
