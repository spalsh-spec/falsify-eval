[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falsify-eval"
version = "0.2.0"
description = "Calibrated falsification harness for retrieval evaluation."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Sparsh Sharma", email = "sparshsharma219@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
keywords = ["retrieval", "evaluation", "falsification", "reproducibility", "rag", "ir"]

[project.optional-dependencies]
test = ["pytest>=7.0", "hypothesis>=6.0"]
dev = ["pytest>=7.0", "hypothesis>=6.0", "mutmut>=2.4", "build>=1.0", "twine>=4.0"]

[project.urls]
Homepage   = "https://github.com/spalsh-spec/falsify-eval"
Issues     = "https://github.com/spalsh-spec/falsify-eval/issues"
Repository = "https://github.com/spalsh-spec/falsify-eval"
Preprint   = "https://arxiv.org/abs/<TBD-on-submission>"

[project.scripts]
falsify-eval = "falsify_eval.cli:main"

[tool.setuptools.packages.find]
include = ["falsify_eval*"]

[tool.mutmut]
# Mutate only the four-null gate. The cli.py metrics, lock helpers, and
# stats helpers are tested adequately by the existing suite; the gate is
# where the epistemic weight is, so that's where we want a survival score.
paths_to_mutate = "falsify_eval/gate.py"
tests_dir = "tests/"
runner = "python -m pytest tests/ -x --tb=no -q --override-ini='addopts='"
