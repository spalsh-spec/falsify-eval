<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="falsify-eval social preview">
  <defs>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f2e8"/>
      <stop offset="1" stop-color="#ede5d3"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d4c8b2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9d8147" stop-opacity="1"/>
      <stop offset="1" stop-color="#d4c8b2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#paper)"/>

  <!-- masthead with Devanagari motif -->
  <text x="640" y="80" font-family="Sanskrit Text, Garamond, Georgia, serif" font-size="22" fill="#9d8147" text-anchor="middle" letter-spacing="3">सत्यमेव जयते</text>
  <text x="640" y="110" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" fill="#9d8147" text-anchor="middle" letter-spacing="6">A HOUSE OF STANDARDS</text>

  <!-- four-null mark, oversized for social preview -->
  <g transform="translate(370, 170)">
    <rect width="120" height="120" rx="20" fill="#9c4a1a" opacity="1.00"/>
    <rect x="140" width="120" height="120" rx="20" fill="#9c4a1a" opacity="0.72"/>
    <rect x="280" width="120" height="120" rx="20" fill="#9c4a1a" opacity="0.46"/>
    <rect x="420" width="120" height="120" rx="20" fill="#9c4a1a" opacity="0.22"/>
    <text x="60"  y="200" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#6b5e4f" text-anchor="middle" letter-spacing="3">A</text>
    <text x="200" y="200" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#6b5e4f" text-anchor="middle" letter-spacing="3">B</text>
    <text x="340" y="200" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#6b5e4f" text-anchor="middle" letter-spacing="3">C</text>
    <text x="480" y="200" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="600" fill="#6b5e4f" text-anchor="middle" letter-spacing="3">D</text>
  </g>

  <!-- wordmark -->
  <text x="640" y="470" font-family="Garamond, EB Garamond, Georgia, serif" font-size="120" font-weight="400" font-style="italic" fill="#1c1611" text-anchor="middle" letter-spacing="-2">falsify-eval</text>

  <!-- tagline -->
  <text x="640" y="515" font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="400" fill="#3a342a" text-anchor="middle" letter-spacing="6">FOUR NULLS · ONE GATE · ZERO INFLATION</text>

  <!-- gold rule -->
  <rect x="380" y="555" width="520" height="2" fill="url(#rule)"/>

  <!-- footer line -->
  <text x="640" y="595" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" fill="#6b5e4f" text-anchor="middle" letter-spacing="3">github.com/spalsh-spec/falsify-eval  ·  apache 2.0  ·  bhardwaj &amp; sons</text>
</svg>
